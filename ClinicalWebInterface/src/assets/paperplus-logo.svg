<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Paper+ compact wordmark: no spacing/kerning between 'Paper' and '+' -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="44" viewBox="0 0 180 44" role="img" aria-label="Paper+">
  <title>Paper+</title>
  <defs>
    <style>
      .brand { fill: #0F172A; }
      .accent { fill: #2563EB; }
    </style>
  </defs>
  <!-- Using a single text element to keep "Paper+" visually bound; font fallback stack -->
  <g transform="translate(8,30)">
    <text class="brand" x="0" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="0">
      Paper
    </text>
    <!-- Render "+" immediately after "Paper" with zero spacing -->
    <text class="accent" x="112" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="0">+</text>
  </g>
</svg>
